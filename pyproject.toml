[project]
name = "saeheewilson-github-io"
version = "0.0.1"
description = "Initial Website for Sae Hee Wilson Github"
authors = [
    {name = "saeheewilson",email = "saeheew@bu.edu"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "matplotlib (>=3.11.1,<4.0.0)"
]

[tool.poetry]
packages = [{include = "saeheewilson"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
